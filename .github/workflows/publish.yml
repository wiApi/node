name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  # npm Trusted Publishing (OIDC): no NPM_TOKEN secret; npm also attaches provenance.
  id-token: write

concurrency:
  group: publish-node-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "ERROR: tag ${{ github.ref_name }} != package.json $PKG_VERSION"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun --bun run build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --access public
